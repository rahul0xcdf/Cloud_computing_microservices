version: '3.8'

services:
  ipc-service:
    build:
      context: ./ipc
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./ipc:/app
    environment:
      - PYTHONUNBUFFERED=1

  system-call-service:
    build:
      context: ./systemcall
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ./systemcall:/app
    environment:
      - PYTHONUNBUFFERED=1 